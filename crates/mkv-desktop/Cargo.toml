[package]
name = "mkv-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mkv-track-editor"
path = "src/main.rs"

[dependencies]
mkv-types.workspace = true
mkv-core.workspace = true
mkv-ui.workspace = true
mkv-profiles.workspace = true
directories = "6"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `unstable-winit-030` exposes winit window events (OS file drag and drop).
# Unstable Slint APIs may change between minor releases, hence the ~1.17 pin.
slint = { version = "~1.17", features = ["unstable-winit-030"] }
rfd = "0.15"

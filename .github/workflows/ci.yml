name: CI

# Pull requests: tests + web and desktop builds (nothing is kept).
# main:          the same, plus desktop archives (workflow artifacts) and the
#                multi-arch Alpine image tagged :main and :sha-<commit>.
# release/X.Y.Z: the same, plus image tags :X.Y.Z, :X.Y and :latest, a
#                GitHub release in the public Homebrew tap repository and an
#                updated tap formula. X.Y.Z must match Cargo.toml's version.
on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main/release runs always finish so
  # every pushed commit gets its image and archives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in test/dev builds: rustc on the Slint-generated UI code
  # otherwise needs more memory than private runners' 7 GB.
  CARGO_PROFILE_DEV_DEBUG: "0"
  IMAGE: ghcr.io/bugsbunny-25/mkv-track-editor
  TAP_REPO: bugsbunny-25/homebrew-tap
  # How users tap it: `brew tap` drops the homebrew- prefix.
  TAP: bugsbunny-25/tap
  # Slint's winit backend links fontconfig and loads xkbcommon at runtime.
  LINUX_BUILD_DEPS: pkg-config libfontconfig1-dev libxkbcommon-dev

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      cargo-version: ${{ steps.version.outputs.cargo-version }}
      publish: ${{ steps.version.outputs.publish }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mkv-desktop") | .version')
          publish=false
          release=false
          version="$cargo_version"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == release/* ]]; then
            branch_version=${GITHUB_REF_NAME#release/}
            if [[ "$branch_version" != "$cargo_version" ]]; then
              echo "::error::Branch $GITHUB_REF_NAME does not match the workspace version $cargo_version in Cargo.toml"
              exit 1
            fi
            publish=true
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            publish=true
            version="${cargo_version}-main.${GITHUB_SHA::7}"
          fi
          {
            echo "cargo-version=$cargo_version"
            echo "version=$version"
            echo "publish=$publish"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (publish=$publish, release=$release)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # mkvtoolnix, mediainfo and ffmpeg let mkv-core's real-binary
      # integration tests run instead of skipping.
      - run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_BUILD_DEPS is a package list
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS mkvtoolnix mediainfo ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mkv-ui's lib and its unit-test build each need ~4.5 GB in rustc;
      # building the libs first keeps them from compiling side by side.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm UI
        working-directory: crates/mkv-web
        run: wasm-pack build --release --target web
      - name: Build server
        run: cargo build --release --locked -p mkv-server

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 so the binaries need only glibc 2.35, the
          # same minimum Homebrew on Linux requires.
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_BUILD_DEPS is a package list
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mkv-desktop
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - if: needs.meta.outputs.publish == 'true'
        run: packaging/package-desktop.sh "${{ needs.meta.outputs.version }}" "${{ matrix.platform }}"
      - if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mkv-track-editor-${{ matrix.platform }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  docker:
    name: Image (${{ matrix.arch }})
    needs: [meta, test, web]
    if: needs.meta.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      # Each architecture builds natively on its own runner and is pushed by
      # digest only; the manifest job below tags the combined image.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Image (multi-arch)
    needs: [meta, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=sha,prefix=sha-,enable=${{ github.ref_name == 'main' }}
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.cargo-version }},enable=${{ needs.meta.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.cargo-version }},enable=${{ needs.meta.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.release == 'true' }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # the tag and digest lists are split on purpose
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  homebrew:
    name: Homebrew release
    needs: [meta, test, web, desktop, docker-manifest]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # Fine-grained token with Contents: read and write on the tap repo.
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mkv-track-editor-*
          merge-multiple: true
      - name: Publish archives to the tap's GitHub release
        run: |
          tag="mkv-track-editor-v$VERSION"
          if ! gh release view "$tag" --repo "$TAP_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$TAP_REPO" \
              --title "MKV Track Editor $VERSION" \
              --notes "Desktop builds of MKV Track Editor $VERSION. Install with \`brew install $TAP/mkv-track-editor\`. Docker: \`$IMAGE:$VERSION\`."
          fi
          # Pushing to the same release branch again republishes this version.
          gh release upload "$tag" --repo "$TAP_REPO" --clobber dist/*.tar.gz dist/*.sha256
      - name: Render formula
        run: |
          sha() { cut -d' ' -f1 "dist/mkv-track-editor-$VERSION-$1.tar.gz.sha256"; }
          SHA256_MACOS_ARM64=$(sha macos-arm64) \
          SHA256_LINUX_X86_64=$(sha linux-x86_64) \
          SHA256_LINUX_ARM64=$(sha linux-arm64) \
            packaging/homebrew/render-formula.sh > "$RUNNER_TEMP/mkv-track-editor.rb"
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit formula to the tap
        working-directory: tap
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/mkv-track-editor.rb" Formula/mkv-track-editor.rb
          git add Formula/mkv-track-editor.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "mkv-track-editor $VERSION"
          git push

  homebrew-verify:
    name: Homebrew install (${{ matrix.runner }})
    needs: [meta, homebrew]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Set up Homebrew
        run: |
          if [[ "$RUNNER_OS" == Linux && ! -x /home/linuxbrew/.linuxbrew/bin/brew ]]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          for brew in /opt/homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew; do
            [[ -x "$brew" ]] && dirname "$brew" >> "$GITHUB_PATH" && break
          done
      - run: brew tap "$TAP"
      - run: brew install "$TAP/mkv-track-editor"
      - run: brew test "$TAP/mkv-track-editor"
      - run: |
          version=$(brew list --versions mkv-track-editor)
          echo "$version"
          [[ "$version" == "mkv-track-editor ${{ needs.meta.outputs.version }}" ]]

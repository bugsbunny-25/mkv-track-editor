name: CI

# Pull requests: tests + web and desktop builds (nothing is kept).
# main:          the same, plus desktop archives (workflow artifacts) and the
#                multi-arch Alpine image tagged :main and :sha-<commit>.
# Release:       called by release.yml with a version and the commit to build:
#                the same, plus image tags :X.Y.Z, :X.Y and :latest, a GitHub
#                release and vX.Y.Z tag in this repository, a GitHub release
#                in the public Homebrew tap repository and an updated tap
#                cask (macOS) and formula (Linux). X.Y.Z must match
#                Cargo.toml's version at that commit.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: Version to release (X.Y.Z); must match Cargo.toml at `ref`
        required: true
        type: string
      ref:
        description: Commit to build and release
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main/release runs always finish so
  # every pushed commit gets its image and archives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/bugsbunny-25/mkv-track-editor
  TAP_REPO: bugsbunny-25/homebrew-tap
  # How users tap it: `brew tap` drops the homebrew- prefix.
  TAP: bugsbunny-25/tap
  # Slint's winit backend links fontconfig and loads xkbcommon at runtime.
  LINUX_BUILD_DEPS: pkg-config libfontconfig1-dev libxkbcommon-dev

jobs:
  meta:
    name: Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      cargo-version: ${{ steps.version.outputs.cargo-version }}
      publish: ${{ steps.version.outputs.publish }}
      release: ${{ steps.version.outputs.release }}
      # A push to main (:main and :sha-<commit> image tags).
      main: ${{ steps.version.outputs.main }}
      # The commit being built (the release commit, for a release).
      sha: ${{ steps.version.outputs.sha }}
      # This release is the highest X.Y.Z overall / within its X.Y, so it
      # moves :latest (and the Homebrew cask and formula) / :X.Y. Releasing
      # an older version doesn't move them back.
      latest: ${{ steps.version.outputs.latest }}
      latest-minor: ${{ steps.version.outputs.latest-minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mkv-desktop") | .version')
          publish=false
          release=false
          main=false
          latest=false
          latest_minor=false
          version="$cargo_version"
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ "$RELEASE_VERSION" != "$cargo_version" ]]; then
              echo "::error::Release $RELEASE_VERSION does not match the workspace version $cargo_version in Cargo.toml"
              exit 1
            fi
            publish=true
            release=true
            # Released versions are the vX.Y.Z tags; this one isn't tagged yet.
            releases=$( { git ls-remote --tags origin 'v*' \
              | sed -n 's#.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p'; echo "$cargo_version"; } )
            highest() { sort -V | tail -n 1; }
            [[ "$cargo_version" == "$(highest <<< "$releases")" ]] && latest=true
            same_minor=$(awk -F. -v v="$cargo_version" 'BEGIN { split(v, c, ".") } $1 == c[1] && $2 == c[2]' <<< "$releases")
            [[ "$cargo_version" == "$(highest <<< "$same_minor")" ]] && latest_minor=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            publish=true
            main=true
            version="${cargo_version}-main.${GITHUB_SHA::7}"
          fi
          {
            echo "cargo-version=$cargo_version"
            echo "version=$version"
            echo "publish=$publish"
            echo "release=$release"
            echo "main=$main"
            echo "sha=$(git rev-parse HEAD)"
            echo "latest=$latest"
            echo "latest-minor=$latest_minor"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (publish=$publish, release=$release, latest=$latest, latest-minor=$latest_minor)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # mkvtoolnix, mediainfo and ffmpeg let mkv-core's real-binary
      # integration tests run instead of skipping.
      - run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_BUILD_DEPS is a package list
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS mkvtoolnix mediainfo ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  web:
    name: Web build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm UI
        working-directory: crates/mkv-web
        run: wasm-pack build --release --target web
      - name: Build server
        run: cargo build --release --locked -p mkv-server

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 so the binaries need only glibc 2.35, the
          # same minimum Homebrew on Linux requires.
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_BUILD_DEPS is a package list
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mkv-desktop
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - if: needs.meta.outputs.publish == 'true'
        run: packaging/package-desktop.sh "${{ needs.meta.outputs.version }}" "${{ matrix.platform }}"
      - if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mkv-track-editor-${{ matrix.platform }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  docker:
    name: Image (${{ matrix.arch }})
    needs: [meta, test, web]
    if: needs.meta.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Labels describe the checked-out commit (the release commit, for a
          # release), not the commit that started the workflow.
          context: git
          images: ${{ env.IMAGE }}
      # Each architecture builds natively on its own runner and is pushed by
      # digest only; the manifest job below tags the combined image.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Image (multi-arch)
    needs: [meta, docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ needs.meta.outputs.main == 'true' }}
            type=sha,prefix=sha-,enable=${{ needs.meta.outputs.main == 'true' }}
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.cargo-version }},enable=${{ needs.meta.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.cargo-version }},enable=${{ needs.meta.outputs.latest-minor == 'true' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.latest == 'true' }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # the tag and digest lists are split on purpose
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  github-release:
    name: GitHub release
    needs: [meta, test, web, desktop, docker-manifest]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mkv-track-editor-*
          merge-multiple: true
      # The release is created as a draft, gets the archives, and is then
      # published, which creates the vX.Y.Z tag on the release commit. Safe
      # to re-run: an existing draft or release is reused and its archives
      # replaced.
      - name: Publish the release and tag it
        env:
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          tag="v$VERSION"
          tagged=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [[ -n "$tagged" && "$tagged" != "$SHA" ]]; then
            echo "::error::Tag $tag already exists on $tagged, not on the release commit $SHA"
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          - macOS (Apple silicon): \`brew install --cask $TAP/mkv-track-editor\`
          - Linux (x86_64, arm64): \`brew install $TAP/mkv-track-editor\`
          - Docker: \`docker pull $IMAGE:$VERSION\`

          EOF
            gh release create "$tag" --draft --target "$SHA" \
              --title "MKV Track Editor $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes
          fi
          gh release upload "$tag" --clobber dist/*.tar.gz dist/*.sha256
          if [[ "$(gh release view "$tag" --json isDraft -q .isDraft)" == true ]]; then
            gh release edit "$tag" --draft=false --latest="${{ needs.meta.outputs.latest }}"
          fi
          git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
          [[ "$(git rev-parse "$tag^{commit}")" == "$SHA" ]]

  homebrew:
    name: Homebrew release
    needs: [meta, test, web, desktop, docker-manifest, github-release]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # Fine-grained token with Contents: read and write on the tap repo.
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: mkv-track-editor-*
          merge-multiple: true
      - name: Publish archives to the tap's GitHub release
        run: |
          tag="mkv-track-editor-v$VERSION"
          if ! gh release view "$tag" --repo "$TAP_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$TAP_REPO" \
              --latest="${{ needs.meta.outputs.latest }}" \
              --title "MKV Track Editor $VERSION" \
              --notes "Desktop builds of MKV Track Editor $VERSION. Install with \`brew install --cask $TAP/mkv-track-editor\` (macOS) or \`brew install $TAP/mkv-track-editor\` (Linux). Docker: \`$IMAGE:$VERSION\`."
          fi
          # Re-running the release replaces the archives.
          gh release upload "$tag" --repo "$TAP_REPO" --clobber dist/*.tar.gz dist/*.sha256
      - name: Render cask and formula
        run: |
          sha() { cut -d' ' -f1 "dist/mkv-track-editor-$VERSION-$1.tar.gz.sha256"; }
          mkdir -p "$RUNNER_TEMP/Casks" "$RUNNER_TEMP/Formula"
          SHA256_MACOS_ARM64=$(sha macos-arm64) \
            packaging/homebrew/render-cask.sh > "$RUNNER_TEMP/Casks/mkv-track-editor.rb"
          SHA256_LINUX_X86_64=$(sha linux-x86_64) \
          SHA256_LINUX_ARM64=$(sha linux-arm64) \
            packaging/homebrew/render-formula.sh > "$RUNNER_TEMP/Formula/mkv-track-editor.rb"
      - if: needs.meta.outputs.latest == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit cask and formula to the tap
        if: needs.meta.outputs.latest == 'true'
        working-directory: tap
        run: |
          mkdir -p Casks Formula
          cp "$RUNNER_TEMP/Casks/mkv-track-editor.rb" Casks/mkv-track-editor.rb
          cp "$RUNNER_TEMP/Formula/mkv-track-editor.rb" Formula/mkv-track-editor.rb
          git add Casks/mkv-track-editor.rb Formula/mkv-track-editor.rb
          if git diff --cached --quiet; then
            echo "Cask and formula unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "mkv-track-editor $VERSION"
          git push

  homebrew-verify:
    name: Homebrew install (${{ matrix.runner }})
    needs: [meta, homebrew]
    if: needs.meta.outputs.latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Set up Homebrew
        run: |
          if [[ "$RUNNER_OS" == Linux && ! -x /home/linuxbrew/.linuxbrew/bin/brew ]]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          for brew in /opt/homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew; do
            [[ -x "$brew" ]] && dirname "$brew" >> "$GITHUB_PATH" && break
          done
      # `brew install` updates Homebrew first for users; do it once here so
      # the check runs the Homebrew they get, not the runner image's stale
      # copy (its patchelf.rb 1.6.2 can't add an RPATH to lld-linked x86_64
      # binaries: Encoding::CompatibilityError in `patch!`).
      - run: brew update
      - run: brew tap "$TAP"
      # macOS: the cask puts the app in /Applications. Its first launch
      # needs "Open Anyway" (the app isn't notarized), so check the install
      # and the bundle signature rather than running it.
      - if: runner.os == 'macOS'
        run: |
          brew install --cask "$TAP/mkv-track-editor"
          codesign --verify --strict --verbose=2 "/Applications/MKV Track Editor.app"
          [[ -x "$(brew --prefix)/bin/mkv-track-editor" ]]
          version=$(brew list --cask --versions mkv-track-editor)
          echo "$version"
          [[ "$version" == "mkv-track-editor ${{ needs.meta.outputs.version }}" ]]
      - if: runner.os == 'Linux'
        run: |
          brew install "$TAP/mkv-track-editor"
          brew test "$TAP/mkv-track-editor"
          version=$(brew list --formula --versions mkv-track-editor)
          echo "$version"
          [[ "$version" == "mkv-track-editor ${{ needs.meta.outputs.version }}" ]]

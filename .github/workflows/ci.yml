name: CI

# Pull requests: tests + web and desktop builds (nothing is kept).
# main:          the same, plus desktop archives (workflow artifacts) and the
#                multi-arch Alpine image tagged :main and :sha-<commit>.
# Releases (release.yml) promote a green main run's image and archives
# instead of building again.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; main runs always finish so every
  # pushed commit gets its image and archives (releases promote them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/bugsbunny-25/mkv-track-editor
  # Slint's winit backend links fontconfig and loads xkbcommon at runtime.
  LINUX_BUILD_DEPS: pkg-config libfontconfig1-dev libxkbcommon-dev

jobs:
  meta:
    name: Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      # A push to main: keep the desktop archives and push the image.
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mkv-desktop") | .version')
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == main ]]; then
            publish=true
            version="${version}-main.${GITHUB_SHA::7}"
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (publish=$publish)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # mkvtoolnix, mediainfo and ffmpeg let mkv-core's real-binary
      # integration tests run instead of skipping.
      - run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_BUILD_DEPS is a package list
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS mkvtoolnix mediainfo ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  web:
    name: Web build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm UI
        working-directory: crates/mkv-web
        run: wasm-pack build --release --target web
      - name: Build server
        run: cargo build --release --locked -p mkv-server

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 so the binaries need only glibc 2.35, the
          # same minimum Homebrew on Linux requires.
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # LINUX_BUILD_DEPS is a package list
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mkv-desktop
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - if: needs.meta.outputs.publish == 'true'
        run: packaging/package-desktop.sh "${{ needs.meta.outputs.version }}" "${{ matrix.platform }}"
      - if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mkv-track-editor-${{ matrix.platform }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  docker:
    name: Image (${{ matrix.arch }})
    needs: [meta, test, web]
    if: needs.meta.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      # Each architecture builds natively on its own runner and is pushed by
      # digest only; the manifest job below tags the combined image.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Image (multi-arch)
    needs: [meta, docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # release.yml finds a release's image by its :sha-<commit> tag.
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # the tag and digest lists are split on purpose
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
